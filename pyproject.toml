[project]
name = "midasdownloader"
version = "0.1.4"
description = "Fast, reliable batch downloader for university entrance admit cards"
readme = "README.md"
authors = [
    { name = "Ayush Bhattarai", email = "git@ayushb.com" }
]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["midas", "admit-card", "downloader", "university", "entrance-exam", "pdf", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "pypdf>=6.16.1",
    "python-dotenv>=1.2.3",
    "rich>=15.0.0",
    "typer>=0.27.1",
]

[project.urls]
Homepage = "https://github.com/aaxyat/MidasDownloader"
Repository = "https://github.com/aaxyat/MidasDownloader"
Issues = "https://github.com/aaxyat/MidasDownloader/issues"

[project.scripts]
midasdownloader = "midasdownloader:main"
sostentrance = "midasdownloader:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"
